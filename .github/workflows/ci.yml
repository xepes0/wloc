name: Validate
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm --prefix worker ci
      - run: npm run check
      - run: npm test
      - run: npm run build:check
      - run: npm run pages:build
      - name: Check native CoreDevice bridge
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable check --manifest-path bridge/native/Cargo.toml

  localdevvpn-integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone LocalDevVPN
        run: git clone --depth 1 https://github.com/jkcoxson/LocalDevVPN.git "$RUNNER_TEMP/LocalDevVPN"
      - name: Prepare WLOC-enabled LocalDevVPN
        run: bash bridge/localdevvpn/integrate-localdevvpn.sh "$RUNNER_TEMP/LocalDevVPN" simulator
      - name: Build for iOS Simulator
        run: |
          case "$(uname -m)" in
            arm64) BUILD_ARCH=arm64 ;;
            x86_64) BUILD_ARCH=x86_64 ;;
            *) echo "unsupported runner architecture"; exit 1 ;;
          esac
          xcodebuild \
            -project "$RUNNER_TEMP/LocalDevVPN/LocalDevVPN.xcodeproj" \
            -scheme LocalDevVPN \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$BUILD_ARCH" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
